# Pulse SwiftLint 配置 — 「检测代码问题」;「美化」归 SwiftFormat(.swiftformat)。
# 门禁(见 scripts/lint.sh 与 .githooks/pre-commit):error 级违规拦截提交,warning 只提示。
# 分工原则:风格/排版类规则一律交给 swiftformat,这里不重复设卡。
disabled_rules:
  - line_length                            # swiftformat maxwidth 120 已管
  - identifier_name                        # 既有缩写命名噪音大
  - type_body_length
  - function_body_length
  - file_length
  - nesting                                # SwiftUI 嵌套 View/Helper 是常态
  - multiple_closures_with_trailing_closure # SwiftUI 处处 trailing closure
  - trailing_comma                         # swiftformat 管(--commas always)
  - trailing_whitespace                    # swiftformat 管
  - vertical_whitespace                    # swiftformat 管
  - opening_brace                          # swiftformat 管
  - todo                                   # 存量 TODO 是有意留的
  - cyclomatic_complexity                  # 先观察存量,不设卡
  - function_parameter_count
  - large_tuple
  - for_where                              # 风格偏好,不强推
excluded:
  - build
  - DerivedData
  - docs
  - .githooks
  - scripts
  - .scratch
  - .claude
  - .worktrees                             # 仓库内 agent worktree 副本(AGENTS.md 分支节)
  - Packages/*/.build                    # SwiftPM 构建产物与依赖源码(GRDB/swift-sdk 等),不是自有代码;漏排轻则违规噪音、重则 swiftlint SIGILL 崩溃(2026-10-26 两票连续实踩:02 PulseMCP/03 PulseHelper,故通配根治)

# ── 自定义规则(机械门禁;CODING_STANDARDS:机械项归 lint,不进评审)──
custom_rules:
  # p4-uninstaller/04 拍板:全系统不可逆出口 = 清空废纸篓 + 卸载域「彻底删除」
  # 勾选,再无第三处。removeItem(atPath:) 只许出现在两个删除执行器文件里;
  # 新增出口先过 ADR-0008 闸门设计(白名单/确认清单/废纸篓默认)再回白名单+写理由。
  # 测试的临时夹具清理(defer)合法,排除测试域。
  no_remove_item_outside_deletion_gates:
    name: "Deletion Gate"
    regex: '\.removeItem\(atPath:'
    excluded:
      - '.*/Pulse/Live/LiveCleanTrashExecutor\.swift'
      - '.*/Pulse/Live/LiveBrewUninstaller\.swift' # LiveCleanPermanentDeleter 所在文件
      - '.*/Tests/.*'
      - '.*/PulseTests/.*'
    message: "永久删除出口仅两处(废纸篓执行器/卸载域永久删除);新出口先过 ADR-0008 闸门再进白名单。"
    severity: error
