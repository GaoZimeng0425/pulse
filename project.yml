name: Pulse
options:
  bundleIdPrefix: com.gaozimeng
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  CocoaLumberjack:
    url: https://github.com/CocoaLumberjack/CocoaLumberjack
    from: 3.8.0
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
targets:
  Pulse:
    type: application
    platform: macOS
    sources:
      - path: Pulse
    dependencies:
      - package: CocoaLumberjack
        product: CocoaLumberjackSwift
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_NAME: Pulse
        PRODUCT_BUNDLE_IDENTIFIER: com.gaozimeng.pulse
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        # Debug(含单测宿主、worktree 开发运行)用独立 bundle id:不与 /Applications 的
        # Release 版共用通知授权、偏好域与 LaunchServices 身份(2026-10-19:同一 id 的
        # 46 条 ad-hoc 注册曾让系统通知授权错乱、设置列表里找不到 Pulse)。
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.gaozimeng.pulse.debug
  PulseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PulseTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gaozimeng.pulse.tests
    dependencies:
      - target: Pulse
schemes:
  Pulse:
    build:
      targets:
        Pulse: all
        PulseTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PulseTests
