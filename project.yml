name: Pulse
options:
  bundleIdPrefix: com.gaozimeng
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  CocoaLumberjack:
    url: https://github.com/CocoaLumberjack/CocoaLumberjack
    from: 3.8.0
  # 纯逻辑层(arch-review-2026-10-18/05):只依赖 Foundation / GRDB,`swift test` 不起宿主可跑。
  PulseCore:
    path: Packages/PulseCore
targets:
  Pulse:
    type: application
    platform: macOS
    sources:
      - path: Pulse
    dependencies:
      - package: CocoaLumberjack
        product: CocoaLumberjackSwift
      # 动态库,必须嵌进 Pulse.app/Contents/Frameworks(不嵌则 Release 启动即找不到库)。
      - package: PulseCore
        product: PulseCore
        embed: true
    settings:
      base:
        PRODUCT_NAME: Pulse
        PRODUCT_BUNDLE_IDENTIFIER: com.gaozimeng.pulse
        # IOReport(Energy Model 订阅,p2-sensors/03)无 SDK 公开头,符号在
        # /usr/lib/libIOReport.dylib;手工 @_silgen_name 声明 + 显式链接
        # (探针④同款做法)。
        OTHER_LDFLAGS: ["-lIOReport"]
        # 图标源 = Pulse/Assets.xcassets/AppIcon.appiconset,由 scripts/render-app-icon.swift
        # 生成;改图标改脚本重跑,不手工替换 png。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        # LSUIElement:启动无 Dock 图标;主窗口打开时现身 Dock、关闭即隐去
        # (DockPresence 运行时切激活策略;2026-11-05 用户拍板,取代 11-03 的 Dock 常驻)。
        INFOPLIST_KEY_LSUIElement: YES
        # 蓝牙家族(p2-sensors/06):IOBluetooth/CoreBluetooth 读设备表与电量,
        # TCC 强制 usage description——缺键即崩(2026-10-22 测试宿主崩溃实证)。
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Pulse 读取已配对蓝牙设备的连接状态与电量,用于外设页展示。
        # 每应用音量(app-volume/01):CoreAudio 进程 tap 首次创建时 TCC 弹
        # 「系统音频捕获」授权;滑块在 100% 时不接管,用户没调过音量就不弹。
        INFOPLIST_KEY_NSAudioCaptureUsageDescription: Pulse 按应用调节音量时需要捕获该应用的音频并重新播放;100% 时不接管,退出后自动恢复原始音量。
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        # Debug(含单测宿主、worktree 开发运行)用独立 bundle id:不与 /Applications 的
        # Release 版共用通知授权、偏好域与 LaunchServices 身份(2026-10-19:同一 id 的
        # 46 条 ad-hoc 注册曾让系统通知授权错乱、设置列表里找不到 Pulse)。
        # Debug 签名换 Apple 开发证书(test-hang-cure/01,2026-11-19 拍板):ad-hoc/自签
        # 每次全新构建都进 AMFI→syspolicyd 评估链,高负载下偶发「放行不来」= hosted
        # 测试宿主 6 分钟挂死(2026-11-18 双挂实案,统一日志实证含 Release 自签同吃
        # -423);苹果证书链系统信任,不进该链。Release 不动(build.sh 自签重签语义不变)。
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.gaozimeng.pulse.debug
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: YHT8FN67G3
  PulseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PulseTests
      # 与包内测试共用的合成夹具:直接编进测试包。不走 PulseCoreTestSupport 产品链接——
      # Xcode 会把它连同 PulseCore 静态链进测试包,与动态库 PulseCore 冲突(05 记过的双份元数据坑)。
      - path: Packages/PulseCore/Sources/PulseCoreTestSupport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gaozimeng.pulse.tests
        # 测试包同签名(宿主同款理由,test-hang-cure/01):测试 dylib 的加载同样
        # 走 AMFI 准入,ad-hoc 会把宿主换证书省掉的评估链在注入环节再吃回来。
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: YHT8FN67G3
    dependencies:
      - target: Pulse
      - package: PulseCore
        product: PulseCore
schemes:
  Pulse:
    build:
      targets:
        Pulse: all
        PulseTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PulseTests
      # 单测默认超时(p2-audit/04):挂死用例 60s 判失败,不再无限等待
      # (2026-10-22 真案:假 AsyncStream 忘 finish() 挂死宿主 30 分钟)。
      testPlans:
        - path: Pulse.xctestplan
