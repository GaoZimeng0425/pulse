name: Pulse
options:
  bundleIdPrefix: com.gaozimeng
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  CocoaLumberjack:
    url: https://github.com/CocoaLumberjack/CocoaLumberjack
    from: 3.8.0
  # 纯逻辑层(arch-review-2026-10-18/05):只依赖 Foundation / GRDB,`swift test` 不起宿主可跑。
  PulseCore:
    path: Packages/PulseCore
targets:
  Pulse:
    type: application
    platform: macOS
    sources:
      - path: Pulse
    dependencies:
      - package: CocoaLumberjack
        product: CocoaLumberjackSwift
      # 动态库,必须嵌进 Pulse.app/Contents/Frameworks(不嵌则 Release 启动即找不到库)。
      - package: PulseCore
        product: PulseCore
        embed: true
    settings:
      base:
        PRODUCT_NAME: Pulse
        PRODUCT_BUNDLE_IDENTIFIER: com.gaozimeng.pulse
        # IOReport(Energy Model 订阅,p2-sensors/03)无 SDK 公开头,符号在
        # /usr/lib/libIOReport.dylib;手工 @_silgen_name 声明 + 显式链接
        # (探针④同款做法)。
        OTHER_LDFLAGS: ["-lIOReport"]
        # 图标源 = Pulse/Assets.xcassets/AppIcon.appiconset,由 scripts/render-app-icon.swift
        # 生成;改图标改脚本重跑,不手工替换 png。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        # Debug(含单测宿主、worktree 开发运行)用独立 bundle id:不与 /Applications 的
        # Release 版共用通知授权、偏好域与 LaunchServices 身份(2026-10-19:同一 id 的
        # 46 条 ad-hoc 注册曾让系统通知授权错乱、设置列表里找不到 Pulse)。
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.gaozimeng.pulse.debug
  PulseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PulseTests
      # 与包内测试共用的合成夹具:直接编进测试包。不走 PulseCoreTestSupport 产品链接——
      # Xcode 会把它连同 PulseCore 静态链进测试包,与动态库 PulseCore 冲突(05 记过的双份元数据坑)。
      - path: Packages/PulseCore/Sources/PulseCoreTestSupport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gaozimeng.pulse.tests
    dependencies:
      - target: Pulse
      - package: PulseCore
        product: PulseCore
schemes:
  Pulse:
    build:
      targets:
        Pulse: all
        PulseTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PulseTests
